# =============================================================================
# agentizr local AI providers
# =============================================================================
#
# One Agent Runtime exposes provider-specific agent definitions. Profiles choose
# which local provider containers start:
#
#   docker compose --profile llama-cpp up
#   docker compose --profile ollama up
#   docker compose --profile all up
#
# Every profile runs one agentizr instance from the Debug project graph with adjacent
# CasCap.Common and CasCap.Api.Azure checkouts mounted read-only. NuGet packages
# and model downloads persist in named volumes.
#
# Endpoints:
#   Agent Runtime : http://localhost:5090
#   llama.cpp     : http://localhost:11434  [llama-cpp profile]
#   Ollama        : http://localhost:11435  [ollama profile]
# =============================================================================

x-agentizr-environment: &agentizr-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CasCap__AgentRuntimeConfig__DefaultTenantId: default
  CasCap__AgentRuntimeConfig__Tenants__default__DefinitionVersion: local-compose-v1
  CasCap__AgentRuntimeConfig__Tenants__default__TimeZoneId: UTC
  CasCap__AgentDefinitionPolicyConfig__AllowedProviderAuthorities__0: http://llama-cpp:8080
  CasCap__AgentDefinitionPolicyConfig__AllowedProviderAuthorities__1: http://ollama:11434
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__LlamaCpp__Type: OpenAI
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__LlamaCpp__Endpoint: http://llama-cpp:8080
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__LlamaCpp__ApiKey: sk-no-key-required
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__LlamaCpp__ModelName: unsloth/Qwen3.5-4B-GGUF:Q5_K_M
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__Ollama__Type: Ollama
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__Ollama__Endpoint: http://ollama:11434
  CasCap__AgentRuntimeConfig__Tenants__default__Providers__Ollama__ModelName: qwen3.5:4b
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__llamacpp__Provider: LlamaCpp
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__llamacpp__Name: llamacpp
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__llamacpp__Description: Local llama.cpp assistant
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__llamacpp__Prompt: Respond to the user's request.
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__llamacpp__Instructions: You are a concise local development assistant.
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__ollama__Provider: Ollama
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__ollama__Name: ollama
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__ollama__Description: Local Ollama assistant
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__ollama__Prompt: Respond to the user's request.
  CasCap__AgentRuntimeConfig__Tenants__default__Agents__ollama__Instructions: You are a concise local development assistant.

x-agentizr: &agentizr
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
  working_dir: /workspace/agentizr
  command:
    - /bin/sh
    - -c
    - |
      set -eu
      mkdir -p /workspace/agentizr /workspace/CasCap.Common /workspace/CasCap.Api.Azure
      (cd /source/agentizr && tar --exclude=.git --exclude=.vs --exclude=bin --exclude=obj --exclude=deps -cf - .) | tar -xf - -C /workspace/agentizr
      (cd /source/CasCap.Common && tar --exclude=.git --exclude=.vs --exclude=bin --exclude=obj -cf - .) | tar -xf - -C /workspace/CasCap.Common
      (cd /source/CasCap.Api.Azure && tar --exclude=.git --exclude=.vs --exclude=bin --exclude=obj -cf - .) | tar -xf - -C /workspace/CasCap.Api.Azure
      exec dotnet run --project src/CasCap.App.Server/CasCap.App.Server.csproj --configuration Debug --no-launch-profile
  volumes:
    - .:/source/agentizr:ro
    - ../CasCap.Common:/source/CasCap.Common:ro
    - ../CasCap.Api.Azure:/source/CasCap.Api.Azure:ro
    - nuget_packages:/root/.nuget/packages
  restart: unless-stopped

services:
  agentizr:
    <<: *agentizr
    profiles: [ llama-cpp, ollama, all ]
    ports:
      - 5090:8080
    environment:
      <<: *agentizr-environment

  llama-cpp:
    profiles: [ llama-cpp, all ]
    # Upstream's server-cuda tag is moving; pin its multi-architecture digest for reproducibility.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:fff6185edd2fbc4093aa5970bf6db53ed11c283e3a1c52a3e244cf27047264f4
    ports:
      - 11434:8080
    volumes:
      - llama_cpp_models:/models
      - ./.docker/llama-cpp-models.ini:/config/models.ini:ro
    environment:
      LLAMA_CACHE: /models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --models-preset
      - /config/models.ini
      - --models-max
      - "1"
      - --metrics
      - --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  ollama:
    profiles: [ ollama, all ]
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    ports:
      - 11435:11434
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    profiles: [ ollama, all ]
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "sh", "-c", "ollama pull qwen3.5:4b" ]
    restart: "no"

volumes:
  llama_cpp_models:
  nuget_packages:
  ollama_models:
